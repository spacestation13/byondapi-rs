[package]
name = "byondapi-macros"
version = "0.4.3"
edition = "2021"
description = "Macros for byondapi"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
proc-macro2 = "1.0"

[dependencies.syn]
version = "3.0.10"
features = ["full", "parsing", "printing"]
