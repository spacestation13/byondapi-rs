[package]
name = "byondapi"
version = "0.7.14"
authors = ["tigercat2000 <nick.pilant@gmail.com>"]
edition = "2021"
description = "Idiomatic Rust bindings for BYONDAPI"
readme = "README.md"
license = "MIT"
repository = "https://github.com/spacestation13/byondapi-rs"
keywords = ["byond", "byondapi"]
exclude = [".vscode/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byondapi-sys = { path = "../byondapi-sys", version = "0.13.3", default-features = false }
byondapi-macros = { path = "../byondapi-macros", version = "0.4.3" }
libloading = "0.8.9"
inventory = "0.3.20"
num_enum = "0.7.3"

[features]
opendream = ["byondapi-sys/opendream"]
